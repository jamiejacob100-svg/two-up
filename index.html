<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6b19b" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1d1a24" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Two Up" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..600&family=Nunito:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="app.css" />
  <title>Two Up — date planner</title>
</head>
<body>
  <!-- Install / first-run hint (shown once on iPhone Safari) -->
  <div id="install-hint" class="install-hint" hidden>
    <div class="install-card">
      <div class="install-emoji">📲</div>
      <h2>Add Two&nbsp;Up to your home screen</h2>
      <p>In Safari, tap <strong>Share</strong> <span class="ios-share">⬆︎</span> then
         <strong>Add to Home Screen</strong>. It opens full-screen like a real app.</p>
      <button class="btn btn-primary" data-dismiss-install>Got it</button>
    </div>
  </div>

  <!-- Demo-mode banner -->
  <div id="demo-banner" class="demo-banner" hidden>
    Demo mode — using sample Sydney places. No account needed.
  </div>

  <main id="view" class="view" aria-live="polite"></main>

  <!-- Bottom sheet host -->
  <div id="sheet-root"></div>
  <!-- Toast host -->
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <nav class="tabbar" role="navigation" aria-label="Main">
    <a href="#/pick"     class="tab" data-tab="pick">     <span class="tab-ico">✦</span><span>Pick</span></a>
    <a href="#/plan"     class="tab" data-tab="plan">     <span class="tab-ico">☀︎</span><span>Plan</span></a>
    <a href="#/plans"    class="tab" data-tab="plans">    <span class="tab-ico">♡</span><span>Plans</span></a>
    <a href="#/places"   class="tab" data-tab="places">   <span class="tab-ico">◎</span><span>Places</span></a>
    <a href="#/memories" class="tab" data-tab="memories"> <span class="tab-ico">📍</span><span>Memories</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
